# Public plugin CI. Hooks in this repo execute on every installer's machine,
# so every PR (including forks) must be tested with a read-only token and
# no repository secrets. Trigger on `pull_request` only — do not grant
# the base-repo token to fork code.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: tests
        run: node tests/run.mjs
      - name: no secrets in tree
        run: |
          set -euo pipefail
          if git grep -I -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-|sk-or-[A-Za-z0-9]|BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!tests/' ':!README.md' ':!skills/'; then
            echo "possible secret in tracked files" >&2
            exit 1
          fi
